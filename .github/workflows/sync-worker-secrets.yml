name: sync-worker-secrets

# 目的：让 Cloudflare Worker 的 INTERNAL_STATUS_TOKEN 与 GitHub secret 同源。
# 该 token 此前需要手工分别写入 GitHub 与 Worker 两端，漏写或两端不一致时，
# translate 工作流回写 POST /status 会被 401 拒绝（pipeline 内是尽力而为、不报错），
# 队列状态就永远卡在「翻译中」。本工作流用 CI 里已有的 CLOUDFLARE_API_TOKEN
# 执行 `wrangler secret put`，把 GitHub secret 的值同步到 Worker，保证两端一致。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler-action 的 secrets 输入：每行一个名字，对每个名字执行
      # `wrangler secret put <NAME>`，值取自同名的环境变量（见 action README）。
      # 红线：if: 表达式里绝不能出现 secrets. —— GitHub 校验器不接受，
      # 会把整个 workflow 判为「无效」而无法派发（translate.yml 曾因此失败）。
      - name: Sync Worker secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            INTERNAL_STATUS_TOKEN
            BREVO_API_KEY
            EMAIL_FROM
            LLM_BASE_URL
            LLM_API_KEY
        env:
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
