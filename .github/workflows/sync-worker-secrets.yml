name: sync-worker-secrets

# 目的：让 Cloudflare Worker 的 INTERNAL_STATUS_TOKEN 与 GitHub secret 同源。
# 该 token 此前需要手工分别写入 GitHub 与 Worker 两端，漏写或两端不一致时，
# translate 工作流回写 POST /status 会被 401 拒绝（pipeline 内是尽力而为、不报错），
# 队列状态就永远卡在「翻译中」。本工作流用 CI 里已有的 CLOUDFLARE_API_TOKEN
# 执行 `wrangler secret put`，把 GitHub secret 的值同步到 Worker，保证两端一致。
#
# TRANSLATE_PASSPHRASE（管理员口令）的真源同样是 GitHub secret：它此前只在 Worker 侧
# 手工 `wrangler secret put` 设过一次，Cloudflare 的 secret 创建后不可读，忘了就只能盲重设。
# 现由本工作流同步到 Worker；值为空时拒绝同步——否则 Worker 里的口令会被覆盖成空值，
# 管理区接口随即退化为 500（worker/index.js 的 !expected 分支），故同步前由 Guard 步骤硬性拦截。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 空值闸门：GitHub secret 未配置时同步会把 Worker 口令覆盖成空串，管理区接口随即不可用。
      - name: "Guard: 口令不得为空（否则 Worker 会变成空口令，任何人可进管理区）"
        env:
          PP: ${{ secrets.TRANSLATE_PASSPHRASE }}
        run: |
          if [ -z "$PP" ]; then
            echo "::error::GitHub secret TRANSLATE_PASSPHRASE 未配置或为空——拒绝同步"
            exit 1
          fi

      # wrangler-action 的 secrets 输入：每行一个名字，对每个名字执行
      # `wrangler secret put <NAME>`，值取自同名的环境变量（见 action README）。
      # 红线：if: 表达式里绝不能出现 secrets. —— GitHub 校验器不接受，
      # 会把整个 workflow 判为「无效」而无法派发（translate.yml 曾因此失败）。
      - name: Sync Worker secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            INTERNAL_STATUS_TOKEN
            BREVO_API_KEY
            EMAIL_FROM
            LLM_API_KEY
            TRANSLATE_PASSPHRASE
        env:
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TRANSLATE_PASSPHRASE: ${{ secrets.TRANSLATE_PASSPHRASE }}
