name: sync

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:

permissions:
  contents: write
  # workflow_dispatch 需要 actions: write（否则调用 dispatch 端点 403）
  actions: write

# 与 translate.yml 共用同一 concurrency 组：两者都会 commit + push，
# 并发运行会互相冲突（non-fast-forward）。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync catalog
        run: npm run catalog

      - name: Sync Modrinth metadata
        run: npm run sync

      - name: Detect changes and write to smart table
        run: node scripts/detect-changes.mjs
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}

      # CurseForge 目录采集是可选步骤：CF 挂了绝不能影响 Modrinth 主链。
      - name: Fetch CurseForge catalog
        continue-on-error: true
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/fetch-curseforge-catalog.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 显式路径，不用 `git add -A`：避免把工作区里无关的临时文件提交进来。
          for p in site/data/modrinth-catalog.json \
                   site/data/modrinth-catalog.prev.json \
                   site/data/shaders.json \
                   site/data/glossary.json \
                   site/data/curseforge-catalog.json; do
            [ -e "$p" ] && git add -- "$p"
          done
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily sync $(date -u +%Y-%m-%d)"
            # 并发保护：别的 workflow/提交可能刚推到 main，先 rebase 再推，失败重试一次。
            # 只 rebase，绝不 force push；rebase 输出原样打印，失败原因可见。
            pushed=false
            for attempt in 1 2; do
              if ! git pull --rebase --autostash origin main; then
                echo "rebase 失败（第 ${attempt} 次），原因见上方输出"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              if git push; then
                pushed=true
                break
              fi
              echo "push 第 ${attempt} 次失败，重试"
              sleep 5
            done
            # 只有确实推送成功才输出 pushed=true；两次都失败则让 run 变红。
            if [ "$pushed" = "true" ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "push 连续 2 次失败，退出非 0"
              exit 1
            fi
          fi

      # GITHUB_TOKEN 的 push 不触发下游 workflow，故推送成功后显式 dispatch deploy。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
