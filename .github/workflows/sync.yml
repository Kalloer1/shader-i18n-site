name: sync

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:

permissions:
  contents: write

# 与 translate.yml 共用同一 concurrency 组：两者都会 commit + push，
# 并发运行会互相冲突（non-fast-forward）。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync catalog
        run: npm run catalog

      - name: Sync Modrinth metadata
        run: npm run sync

      - name: Detect changes and write to smart table
        run: node scripts/detect-changes.mjs
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 显式路径，不用 `git add -A`：避免把工作区里无关的临时文件提交进来。
          for p in site/data/modrinth-catalog.json \
                   site/data/modrinth-catalog.prev.json \
                   site/data/shaders.json \
                   site/data/glossary.json; do
            [ -e "$p" ] && git add -- "$p"
          done
          git diff --cached --quiet || git commit -m "chore: daily sync $(date -u +%Y-%m-%d)"
          git push
