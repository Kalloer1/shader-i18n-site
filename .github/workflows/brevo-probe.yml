name: brevo-probe

# 一次性诊断：在 CI 里直接调 Brevo 发一封自检邮件，把 Brevo 的原始响应打出来，
# 用于定位「玩家收不到通知邮件」的原因（发信通道被 Brevo 拒绝 vs 玩家侧拦截）。
# 只保留 workflow_dispatch：无定时、无 push 触发，避免被反复调用。
#
# 发件人与收件人都取自 EMAIL_FROM（自发自收）。刻意不提供任何「收件人」输入参数：
# 仓库是公开的，把邮箱地址作为 workflow 输入会写进 run 元数据里暴露出去。
# 备用收件人走临时 secret NOTIFY_TEST_TO（未配置则跳过该步），同样不出现在输入参数/文件里。
# 打印原始响应体是安全的：GitHub 会自动把 secret 值在日志中打码。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Send self-check mail via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          if [ -z "${BREVO_API_KEY:-}" ] || [ -z "${EMAIL_FROM:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 或 EMAIL_FROM 未注入，本次探针无意义"
            exit 1
          fi

          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "probe ts (UTC): $ts"

          body="{\"sender\":{\"email\":\"$EMAIL_FROM\",\"name\":\"shader-i18n-site\"},\"to\":[{\"email\":\"$EMAIL_FROM\"}],\"subject\":\"【探针】Brevo 发信自检\",\"textContent\":\"Brevo 发信自检（工作流 brevo-probe）。UTC 时间戳：$ts\"}"

          curl -sS -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "api-key: $BREVO_API_KEY" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$body" \
            -w "\nHTTP=%{http_code}\n"

      # 上一步只看「Brevo 是否受理」，看不到「发件身份是否被收件方信任」。
      # 这里查发件人（sender）与发件域名（domain）的认证状态：
      #   senders          -> 每个 sender 的 active 字段（false 或不在列表 = 未验证）
      #   senders/domains  -> 已认证的发件域名（空数组 = 没有认证域名，SPF/DKIM 无对齐）
      # 响应里只有发件人地址与状态，不含密钥；GitHub 也会自动打码 secret 值。
      - name: Inspect Brevo sender/domain authentication status
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 未注入，无法查询发件人/域名认证状态"
            exit 1
          fi

          for ep in senders senders/domains; do
            echo "=== GET https://api.brevo.com/v3/$ep ==="
            curl -sS -X GET "https://api.brevo.com/v3/$ep" \
              -H "api-key: $BREVO_API_KEY" \
              -H "accept: application/json" \
              -w "\nHTTP=%{http_code}\n"
            echo
          done

      # 换一个收件邮箱再发一封：区分「某个收件方拦了」还是「普遍送不达」。
      # 收件地址来自临时 secret NOTIFY_TEST_TO（仓库是公开的，绝不能写成输入参数/写进文件）。
      # secret 未配置则跳过，不报错。注意红线：if: 表达式里不能引用 secrets.*，
      # 所以这里用 env: 注入后在 shell 里判断。
      - name: Send test mail to alternate recipient
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_TEST_TO: ${{ secrets.NOTIFY_TEST_TO }}
        run: |
          if [ -z "${NOTIFY_TEST_TO:-}" ]; then
            echo "未配置备用收件人，跳过"
            exit 0
          fi

          if [ -z "${BREVO_API_KEY:-}" ] || [ -z "${EMAIL_FROM:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 或 EMAIL_FROM 未注入，本次探针无意义"
            exit 1
          fi

          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "probe ts (UTC): $ts"

          body="{\"sender\":{\"email\":\"$EMAIL_FROM\",\"name\":\"shader-i18n-site\"},\"to\":[{\"email\":\"$NOTIFY_TEST_TO\"}],\"subject\":\"【探针】送达测试（备用收件箱）\",\"textContent\":\"备用收件箱送达测试（工作流 brevo-probe）。UTC 时间戳：$ts\"}"

          curl -sS -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "api-key: $BREVO_API_KEY" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$body" \
            -w "\nHTTP=%{http_code}\n"
