name: brevo-probe

# 一次性诊断：在 CI 里直接调 Brevo 发一封自检邮件，把 Brevo 的原始响应打出来，
# 用于定位「玩家收不到通知邮件」的原因（发信通道被 Brevo 拒绝 vs 玩家侧拦截）。
# 只保留 workflow_dispatch：无定时、无 push 触发，避免被反复调用。
#
# 发件人取自 EMAIL_FROM；收件人取自临时 secret NOTIFY_TEST_TO（未配置则跳过发信测试）。
# 刻意不提供任何「收件人」输入参数：仓库是公开的，把邮箱地址作为 workflow 输入
# 会写进 run 元数据里暴露出去。收件地址只走 secret，不出现在输入参数/文件里。
# 收件人不要再改回 EMAIL_FROM：它是 noreply@ 发件地址，其域无 MX（设计如此），发到它必然 bounce。
# 打印原始响应体是安全的：GitHub 会自动把 secret 值在日志中打码。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # 本步骤只用于验证「能发到真实收件箱」，收件人必须是真实收件箱（secret NOTIFY_TEST_TO）。
      # ⚠️ 不要把收件人改回 EMAIL_FROM：EMAIL_FROM 是 noreply@mccnp.top 发件地址，
      # 该域没有 MX 记录（设计如此，noreply@ 不该收信）→ 发到它必然 softBounces
      # （reason: Unable to find MX of domain mccnp.top），这是假故障信号，
      # 不能用来判断「发信是否正常」。
      # 判断发信是否正常，应看「Inspect Brevo delivery events」里是否有 delivered；
      # 正常投递的事件序列实测为 requests → delivered → opened。
      # 收件地址来自临时 secret（仓库是公开的，绝不能写成输入参数/写进文件）。
      # secret 未配置则跳过，不报错。注意红线：if: 表达式里不能引用 secrets.*，
      # 所以这里用 env: 注入后在 shell 里判断。
      - name: Send self-check mail via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_TEST_TO: ${{ secrets.NOTIFY_TEST_TO }}
        run: |
          if [ -z "${NOTIFY_TEST_TO:-}" ]; then
            echo "未配置真实收件箱（secret NOTIFY_TEST_TO 为空），跳过发信测试；判断发信是否正常请看投递事件里的 delivered"
            exit 0
          fi

          if [ -z "${BREVO_API_KEY:-}" ] || [ -z "${EMAIL_FROM:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 或 EMAIL_FROM 未注入，本次探针无意义"
            exit 1
          fi

          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "probe ts (UTC): $ts"

          body="{\"sender\":{\"email\":\"$EMAIL_FROM\",\"name\":\"shader-i18n-site\"},\"to\":[{\"email\":\"$NOTIFY_TEST_TO\"}],\"subject\":\"【探针】Brevo 发信自检\",\"textContent\":\"Brevo 发信自检（工作流 brevo-probe）。UTC 时间戳：$ts\"}"

          curl -sS -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "api-key: $BREVO_API_KEY" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$body" \
            -w "\nHTTP=%{http_code}\n"

      # 上一步只看「Brevo 是否受理」，看不到「发件身份是否被收件方信任」。
      # 这里查发件人（sender）与发件域名（domain）的认证状态：
      #   senders          -> 每个 sender 的 active 字段（false 或不在列表 = 未验证）
      #   senders/domains  -> 已认证的发件域名（空数组 = 没有认证域名，SPF/DKIM 无对齐）
      # 响应里只有发件人地址与状态，不含密钥；GitHub 也会自动打码 secret 值。
      - name: Inspect Brevo sender/domain authentication status
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 未注入，无法查询发件人/域名认证状态"
            exit 1
          fi

          for ep in senders senders/domains; do
            echo "=== GET https://api.brevo.com/v3/$ep ==="
            curl -sS -X GET "https://api.brevo.com/v3/$ep" \
              -H "api-key: $BREVO_API_KEY" \
              -H "accept: application/json" \
              -w "\nHTTP=%{http_code}\n"
            echo
          done

      # 创建/认证发件域名 mccnp.top：senders/domains 为空说明没有任何认证域名，
      # EMAIL_FROM 又挂在免费邮箱（foxmail.com）上，没有 DKIM/SPF 对齐，QQ 侧会直接丢弃。
      # POST 的响应体里就带着「需要到 DNS 添加的记录」（DKIM 的 name/value、Brevo 域名验证 code），
      # 所以这里把状态码与响应体原文原样打出来，不做任何加工。
      # 若返回「域名已存在」之类的 4xx，不放弃：回退到 GET 查该域名详情，记录同样在响应里。
      # 本步只在 Brevo 侧建域名/查记录，不碰任何 DNS，也不回显 secret 值。
      - name: Create Brevo sending domain and dump DNS records
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 未注入，无法创建/查询发件域名"
            exit 1
          fi

          resp_file="$(mktemp)"
          code="$(curl -sS -o "$resp_file" -w '%{http_code}' -X POST "https://api.brevo.com/v3/senders/domains" \
            -H "api-key: $BREVO_API_KEY" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"name":"mccnp.top"}')"
          echo "=== POST https://api.brevo.com/v3/senders/domains ==="
          echo "HTTP=$code"
          echo "--- raw body ---"
          cat "$resp_file"
          echo
          rm -f "$resp_file"

          if [ "$code" -ge 400 ]; then
            echo "创建未成功（HTTP=$code），回退查询已存在域名的详情："
            for ep in "senders/domains" "senders/domains/mccnp.top"; do
              echo "=== GET https://api.brevo.com/v3/$ep ==="
              curl -sS -X GET "https://api.brevo.com/v3/$ep" \
                -H "api-key: $BREVO_API_KEY" \
                -H "accept: application/json" \
                -w "\nHTTP=%{http_code}\n"
              echo
            done
          fi

      # 触发域名认证并轮询结果：mccnp.top 已在 Brevo 侧建好（id 6acff73a8bf5a7deb30e60e7），
      # 但 authenticated/verified 都是 false —— DKIM/SPF 无对齐，收件方（QQ）在 SMTP 层直接 550 拒收。
      # 4 条 DNS 记录已由主管写进 Cloudflare，这里触发 Brevo 复核，并打印 4 条记录各自的 status。
      # DNS 刚写入，传播 + Brevo 核对都需要时间，所以同一次运行内最多重试 4 轮（每轮间隔 60s）。
      # 首选 PUT .../authenticate；若端点不存在（404/405），逐个试其它合理端点并把原文贴出来。
      - name: Authenticate Brevo sending domain mccnp.top
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 未注入，无法认证发件域名"
            exit 1
          fi

          domain="mccnp.top"
          base="https://api.brevo.com/v3/senders/domains/$domain"
          resp_file="$(mktemp)"
          last_code=""

          # req <method> <url>：把状态码与响应体原文原样打出来，状态码留在 last_code 里。
          # 结尾的 || true 是给 set -e 用的：网络层失败时也要继续走后面的查询，而不是中断整步。
          req() {
            last_code="$(curl -sS -o "$resp_file" -w '%{http_code}' -X "$1" "$2" \
              -H "api-key: $BREVO_API_KEY" \
              -H "accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{}')" || true
            echo "=== $1 $2 ==="
            echo "HTTP=$last_code"
            echo "--- raw body ---"
            cat "$resp_file"
            echo
          }

          # dns_records 里 dkim1/dkim2/brevo_code/dmarc 四条记录的 status 全为 true 才算对齐完成。
          all_records_ok() {
            node -e '
              const fs = require("fs");
              const j = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const recs = (j.dns_records && Object.values(j.dns_records).filter(Boolean)) || [];
              const flags = recs.map((r) => r.status === true);
              console.log(`authenticated=${j.authenticated} verified=${j.verified} recordStatus=${JSON.stringify(flags)}`);
              process.exit(flags.length > 0 && flags.every(Boolean) ? 0 : 1);
            ' "$resp_file"
          }

          req PUT "$base/authenticate"
          if [ "$last_code" = "404" ] || [ "$last_code" = "405" ]; then
            echo "首选端点不存在（HTTP=$last_code），逐个试其它合理端点："
            req POST "$base/authenticate"
            req PUT "$base"
          fi

          for attempt in 1 2 3 4 5; do
            echo "--- 认证状态第 $attempt 次查询（共 5 次）---"
            req GET "$base"
            if all_records_ok; then
              echo "✅ 域名 $domain 认证完成"
              rm -f "$resp_file"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "尚未全部生效，60s 后重试"
              sleep 60
            fi
          done

          echo "⚠️ 5 次查询后仍未全部生效，最终状态见上（不改 EMAIL_FROM）"
          rm -f "$resp_file"

      # 换一个收件邮箱再发一封：区分「某个收件方拦了」还是「普遍送不达」。
      # 收件地址来自临时 secret NOTIFY_TEST_TO（仓库是公开的，绝不能写成输入参数/写进文件）。
      # secret 未配置则跳过，不报错。注意红线：if: 表达式里不能引用 secrets.*，
      # 所以这里用 env: 注入后在 shell 里判断。
      - name: Send test mail to alternate recipient
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_TEST_TO: ${{ secrets.NOTIFY_TEST_TO }}
        run: |
          if [ -z "${NOTIFY_TEST_TO:-}" ]; then
            echo "未配置备用收件人，跳过"
            exit 0
          fi

          if [ -z "${BREVO_API_KEY:-}" ] || [ -z "${EMAIL_FROM:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 或 EMAIL_FROM 未注入，本次探针无意义"
            exit 1
          fi

          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "probe ts (UTC): $ts"

          body="{\"sender\":{\"email\":\"$EMAIL_FROM\",\"name\":\"shader-i18n-site\"},\"to\":[{\"email\":\"$NOTIFY_TEST_TO\"}],\"subject\":\"【探针】送达测试（备用收件箱）\",\"textContent\":\"备用收件箱送达测试（工作流 brevo-probe）。UTC 时间戳：$ts\"}"

          curl -sS -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "api-key: $BREVO_API_KEY" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$body" \
            -w "\nHTTP=%{http_code}\n"

      # 取 Brevo 自己的投递事件：前面两封都只看到 HTTP=201（= Brevo 受理），但收件方收件箱/垃圾箱都没有，
      # 说明信在「受理」之后被丢弃。事件记录（delivered / blocked / bounced / spam + reason）是唯一能定性的证据。
      # 响应里的邮箱地址来自 secret，GitHub 会自动打码。
      - name: Inspect Brevo delivery events
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo "缺少 secret：BREVO_API_KEY 未注入，无法查询投递事件"
            exit 1
          fi

          resp_file="$(mktemp)"
          code="$(curl -sS -o "$resp_file" -w '%{http_code}' -X GET \
            "https://api.brevo.com/v3/smtp/statistics/events?limit=30&sort=desc" \
            -H "api-key: $BREVO_API_KEY" \
            -H "accept: application/json")"
          echo "=== GET https://api.brevo.com/v3/smtp/statistics/events?limit=30&sort=desc ==="
          echo "HTTP=$code"
          echo "--- raw body ---"
          cat "$resp_file"
          echo
          rm -f "$resp_file"

          if [ "$code" -ge 400 ]; then
            echo "默认参数被拒（HTTP=$code），补上官方要求的 days 参数重试："
            curl -sS -X GET "https://api.brevo.com/v3/smtp/statistics/events?limit=30&days=1&sort=desc" \
              -H "api-key: $BREVO_API_KEY" \
              -H "accept: application/json" \
              -w "\nHTTP=%{http_code}\n"
          fi

          # 自检信是自发自收（收件人=发件人=EMAIL_FROM），所以按该地址过滤两种情况都能覆盖。
          if [ -n "${EMAIL_FROM:-}" ]; then
            echo "=== 按邮箱过滤（$EMAIL_FROM）==="
            curl -sS -X GET "https://api.brevo.com/v3/smtp/statistics/events?limit=30&sort=desc&email=$EMAIL_FROM" \
              -H "api-key: $BREVO_API_KEY" \
              -H "accept: application/json" \
              -w "\nHTTP=%{http_code}\n"
          fi
