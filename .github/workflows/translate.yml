name: translate

# 站点 /request 页点「开启翻译」→ Worker POST /translate → 本工作流。
# inputs.ids 是逗号分隔的 shaderId 列表（Worker 传入全部「待翻译」条目）。
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '逗号分隔的 shaderId 列表'
        required: true
        type: string
      source:
        description: '留空=Modrinth；填 curseforge 走 CurseForge'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  # workflow_dispatch 需要 actions: write（否则调用 dispatch 端点 403）
  actions: write

# 与 sync.yml 共用 concurrency 组：两者都会 commit + push。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # 每条光影在 pipeline 内独立 5 分钟超时；这里给整批留出余量。
    # 上限 360 分钟（GitHub Actions 单 job 硬上限）。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # pipeline 会写回 site/data 与 site/public/lang，需要可 push 的凭据
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # 闸门：先把仓库里已有的 lang 全部校验一遍，避免带着历史问题继续产出。
      # EN 原文来自 data/lang-sources.json.gz（sources/ 未入库）。
      - name: Run tests
        run: npm test

      - name: Validate existing lang files
        run: npm run validate:lang

      # 网盘凭证（阶段 0 实测通过后才存在；缺失时 mirror 自动跳过该网盘）。
      # 注意：**不能用 `if: ${{ secrets.X != '' }}`** —— GitHub 的 if 表达式校验器
      # 不接受 secrets 上下文，会让整个 workflow 变成「无效」而无法派发。
      # 改为把 secret 传成环境变量，在 shell 里判断。
      - name: Restore quark config
        env:
          QUARK_CONFIG_JSON: ${{ secrets.QUARK_CONFIG_JSON }}
        run: |
          if [ -z "$QUARK_CONFIG_JSON" ]; then
            echo "未提供 QUARK_CONFIG_JSON，跳过"
            exit 0
          fi
          set -e
          SKILL_DIR="$HOME/.pi/agent/skills/quarkclouddrive"
          mkdir -p "$SKILL_DIR/.quarkclouddrive/openclaw"
          printf '%s' "$QUARK_CONFIG_JSON" > "$SKILL_DIR/.quarkclouddrive/openclaw/config.json"
          chmod 600 "$SKILL_DIR/.quarkclouddrive/openclaw/config.json"

      - name: Translate
        run: node scripts/pipeline.mjs --ids "${{ inputs.ids }}"
        env:
          CF_SOURCE: ${{ inputs.source }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODELS: ${{ secrets.LLM_MODELS || secrets.LLM_MODEL || 'muse-spark-1.3-contributor-free,muse-spark-1.2-contributor-free,mimo-v2.6-flash-free' }}
          LLM_CONCURRENCY: ${{ secrets.LLM_CONCURRENCY || '10' }}
          LLM_EXTRA_BODY: ${{ secrets.LLM_EXTRA_BODY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }} # 保留，作为 LLM_API_KEY 的别名
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      - name: Mirror to cloud drives
        # 网盘不可用时不阻断发布：镜像失败只让对应字段留空。
        continue-on-error: true
        run: node scripts/mirror.mjs --ids "${{ inputs.ids }}"
        env:
          QUARK_CLI: ${{ secrets.QUARK_CLI_PATH }}
          QUARK_PARENT_FID: ${{ secrets.QUARK_PARENT_FID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      - name: Repack lang sources
        # pipeline 会把本次新翻译的 en_US.lang 写入 sources/；
        # 必须重新打包，否则新光影在下次 CI 校验时找不到英文源而假失败。
        # 打包会与已有包合并，不会抹掉历史条目。
        # 零产出时 sources/ 不存在（gitignored），必须跳过而不是失败，
        # 否则整个 workflow 会被判失败，后面的 Commit and push 不执行。
        run: |
          if [ ! -d sources ]; then
            echo "本次没有新翻译（sources/ 不存在），跳过打包"
            exit 0
          fi
          npm run pack:lang

      # 闸门（写入之后）：上面的 Run tests 跑在 Translate 之前，只能拦历史数据；
      # 本次 Translate / Mirror 新写入的产物不在那次校验范围内，曾出现「本轮 run 绿、
      # 下一个 deploy 红」的静默失败（makeup-ultra-fast-shader 缺 modrinth + 防死链回归）。
      # 与前面「写入之前」的闸门互补：宁可这一轮产物不推、run 变红，
      # 也不要把「下一个 deploy 必红」的数据留在 main 上。
      - name: Validate data contract after translate
        run: npm test

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 显式路径，禁止 git add -A（否则会裹入无关文件）
          for p in site/public/lang site/data/shaders.json site/data/glossary.json site/data/modrinth-catalog.json site/data/curseforge-catalog.json data/lang-sources.json.gz; do
            [ -e "$p" ] && git add -- "$p"
          done
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "翻译: ${{ inputs.ids }}"
          # 并发保护：别的 workflow/提交可能刚推到 main，先 rebase 再推，失败重试一次。
          # 只 rebase，绝不 force push；rebase 输出原样打印，失败原因可见。
          pushed=false
          for attempt in 1 2; do
            if ! git pull --rebase --autostash origin main; then
              echo "rebase 失败（第 ${attempt} 次），原因见上方输出"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            if git push; then
              pushed=true
              break
            fi
            echo "push 第 ${attempt} 次失败，重试"
            sleep 5
          done
          # 只有确实推送成功才输出 pushed=true；两次都失败则让 run 变红。
          if [ "$pushed" = "true" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "push 连续 2 次失败，退出非 0"
            exit 1
          fi

      # GITHUB_TOKEN 的 push 不触发下游 workflow，故推送成功后显式 dispatch deploy。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
