name: translate

# 站点 /request 页点「开启翻译」→ Worker POST /translate → 本工作流。
# inputs.ids 是逗号分隔的 shaderId 列表（Worker 传入全部「待翻译」条目）。
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '逗号分隔的 shaderId 列表'
        required: true
        type: string
      source:
        description: '留空=Modrinth；填 curseforge 走 CurseForge'
        required: false
        type: string
        default: ''
      models:
        description: '逗号分隔的**网关**模型名（→ LLM_MODELS）；留空则用仓库默认。来自 /request 页管理员勾选，Worker 已对网关实时列表做白名单校验'
        required: false
        type: string
        default: ''
      freeTierModel:
        description: '**单个**免费层模型名（→ FREE_TIER_MODEL）；留空=用 secrets.FREE_TIER_MODEL。仅用于把池子收窄成一个模型时用；日常留空走默认多模型池'
        required: false
        type: string
        default: ''
      freeTierModels:
        description: '逗号分隔的**免费层模型池**（→ FREE_TIER_MODELS），优先于 freeTierModel；留空=用仓库默认池（index-mt-9b / index-mt-9b-syllable / Index-Translate-35B-A3B / index-mt-2b / index-mt-2b-syllable）'
        required: false
        type: string
        default: ''
      gateway:
        description: '是否启用网关回退池（false=只跑免费层，免费层失败即停，不再转交网关）。默认 true，与既有行为一致'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  # workflow_dispatch 需要 actions: write（否则调用 dispatch 端点 403）
  actions: write

# 与 sync.yml 共用 concurrency 组：两者都会 commit + push。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # 每条光影在 pipeline 内独立 5 分钟超时；这里给整批留出余量。
    # 上限 360 分钟（GitHub Actions 单 job 硬上限）。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # pipeline 会写回 site/data 与 site/public/lang，需要可 push 的凭据
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # 闸门：先把仓库里已有的 lang 全部校验一遍，避免带着历史问题继续产出。
      # EN 原文来自 data/lang-sources.json.gz（sources/ 未入库）。
      - name: Run tests
        run: npm test

      - name: Validate existing lang files
        run: npm run validate:lang

      # 网盘凭证（阶段 0 实测通过后才存在；缺失时 mirror 自动跳过该网盘）。
      # 注意：**不能用 `if: ${{ secrets.X != '' }}`** —— GitHub 的 if 表达式校验器
      # 不接受 secrets 上下文，会让整个 workflow 变成「无效」而无法派发。
      # 改为把 secret 传成环境变量，在 shell 里判断。
      - name: Restore quark config
        env:
          QUARK_CONFIG_JSON: ${{ secrets.QUARK_CONFIG_JSON }}
        run: |
          if [ -z "$QUARK_CONFIG_JSON" ]; then
            echo "未提供 QUARK_CONFIG_JSON，跳过"
            exit 0
          fi
          set -e
          SKILL_DIR="$HOME/.pi/agent/skills/quarkclouddrive"
          # 路径必须是 CLI 真正读取的位置：<技能根>/qoder/config.json。
          # 旧写法 <技能根>/.quarkclouddrive/openclaw/config.json 不生效（本机实测），
          # 会让 CLI 表现为未登录，进而“绿色通过但零链接”。
          mkdir -p "$SKILL_DIR/qoder"
          printf '%s' "$QUARK_CONFIG_JSON" > "$SKILL_DIR/qoder/config.json"
          chmod 600 "$SKILL_DIR/qoder/config.json"
          echo "登录态已写入 $SKILL_DIR/qoder/config.json（$(wc -c < "$SKILL_DIR/qoder/config.json" | tr -d ' ') 字节，内容不打印）"

      # CLI 是 620KB 自包含单文件，进不了 secret（>48KB）也不入库，只能每次从服务端下载。
      # 安装失败只警告不阻断：镜像失败只让网盘字段留空，不该卡住翻译发布；
      # 失败痕迹由 ::warning:: 与下面 Mirror 步骤的跳过日志承担，不静默。
      # 但本步骤容错（exit 0）不等于本轮可以没有夸克：Mirror 步骤带 QUARK_REQUIRED=1，
      # CLI 缺失时会在产物入库之后统一判红（见末尾 Fail if quark mirror totally failed）。
      - name: Install quark CLI
        continue-on-error: true
        run: bash scripts/install-quark-cli.sh

      # 把「本轮实际用了哪两条路径」打出来。免费层与网关是独立环境变量，只打印 pipeline 的输出
      # 不够——出问题时第一个要确认的就是「UI 勾的东西到底有没有到这一步」。
      - name: Show selected translation models
        run: |
          echo "网关模型 LLM_MODELS：${LLM_MODELS}"
          echo "网关开关 GATEWAY_ENABLED（inputs.gateway=${GATEWAY_INPUT:+已传}）：${GATEWAY_ENABLED}"
          echo "免费层模型池 FREE_TIER_MODELS：${FREE_TIER_MODELS:-（未设，用仓库默认池）}"
          echo "单个免费层模型 FREE_TIER_MODEL（inputs.freeTierModel=${FREE_TIER_INPUT:+已传}）：${FREE_TIER_MODEL:-（未设）}"
          echo "免费层开关 FREE_TIER_ENABLED：${FREE_TIER_ENABLED}"
        env:
          LLM_MODELS: ${{ inputs.models || secrets.LLM_MODELS || 'kilo/kilo-auto/free,kilo/poolside/laguna-s-2.1:free' }}
          # 注意：这里**不再**给 FREE_TIER_MODEL 兜底硬编码默认值。
          # 兜底会把默认多模型池收窄成单模型（旧默认 index-mt-9b-syllable），
          # 2026-10-21 已改为 5 模型池，必须让 pipeline 的默认值生效。
          FREE_TIER_MODEL: ${{ inputs.freeTierModel || secrets.FREE_TIER_MODEL }}
          FREE_TIER_MODELS: ${{ inputs.freeTierModels || secrets.FREE_TIER_MODELS }}
          FREE_TIER_ENABLED: ${{ secrets.FREE_TIER_ENABLED || '1' }}
          FREE_TIER_INPUT: ${{ inputs.freeTierModel }}
          GATEWAY_ENABLED: ${{ inputs.gateway == false && '0' || '1' }}
          GATEWAY_INPUT: ${{ inputs.gateway }}

      - name: Translate
        run: node scripts/pipeline.mjs --ids "${{ inputs.ids }}"
        env:
          CF_SOURCE: ${{ inputs.source }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # 网关回退池总开关（用户 2026-10-21 需求：网关模型实测挂死，一个分块吃满 8 分钟）。
          # false → GATEWAY_ENABLED=0：只跑免费层，免费层失败即停，不再转交网关。
          # 不传时 inputs.gateway 默认 true → '1'，与既有行为逐字一致。
          GATEWAY_ENABLED: ${{ inputs.gateway == false && '0' || '1' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 这些名字必须是网关 https://api.888424.xyz/v1 上真实存在的；改动前请先实测
          # （POST /chat/completions 发一段真实 lang 条目，看是否严格回 key=value）。
          # 旧默认值 muse-spark-*/mimo-v2.6-flash-free 在网关上不存在，已实测确认删除。
          #
          # ⚠️ 这个列表是**轮班**，不是优先级回退链：pipeline 每个分块从 providers[i % N] 开始
          # （见 scripts/pipeline.mjs nextProviderOrder），所以**列表里每个模型都会分到约 1/N 的分块**。
          # 因此**只有「格式严格遵守 + 零丢键」的模型才能进这个列表** —— 「能用」不是入选理由，
          # 弱模型放进来会实打实拉低 1/N 的产出（不会因为排在后面就被跳过）。
          # 入选前必须实测：POST /chat/completions 发真实 lang 条目（含 .comment 键与 § 颜色码），
          # 检查是否严格回 key=value、有没有丢键、§ 码是否原样保留。
          # 已实测淘汰：tencent/Hunyuan-MT-7B（改写键名、丢 option.WATER_WAVES.comment）、
          # hy3（推理 token 吃光预算 → 正文全空）、tencent/Hy4-preview 与 A13B（21.5s/12.7s 过慢）、
          # step-5-preview（推理模型、截断）、aixhub/*（429 限流）、gpt-6-astra（402 额度耗尽）、
          # deepseek-v4.1-flash / deepseek-v4-flash / u2-flash（2026-10-17 网关账号池空，全部 503
          # No available channel）、opencode-zen-free/nemotron-3.5-lightning-free（90s 超时）。
          #
          # ⚠️ 2026-10-20 实测：上一版三个 opencode-zen-free/* 模型**已从网关下架**，
          # GET /models 只剩 16 个（全部 kilo/* 与 tencent/Hunyuan-MT-7B）。旧池已全部失效。
          #
          # 当前两个（2026-10-20 实测，5 行真实 lang 条目含 § 与 %s）：
          #   kilo/kilo-auto/free            3.8~15.6s  5/5 键、§ 与占位符零漂移
          #   kilo/poolside/laguna-s-2.1:free 3.2~4.5s  5/5 键、同上
          # 其余 13 个 kilo/* 实测全部 429（每日额度耗尽），Hunyuan-MT-7B 会用 ``` 包住
          # 整段输出（历史上已因改写键名/丢键淘汰过），故均不入选。
          #
          # ⚠️ 速度注意：kilo-auto 首次调用可能 15s+，整条光影 4 块实测约 9 分钟，
          # 接近 PER_SHADER_TIMEOUT_MS(15min) 上限。若后续加块数，需先评估超时。
          # 实测口径：真实形态 37~74 行分块（含 .comment 长句、%s / %1$s 占位符、§e[+]§r 颜色码）。
          # 该输入来自 /request 页管理员口令门禁后的模型多选（Worker 已对网关实时列表做白名单校验，
          # 绝不允许任意字符串透传进 workflow）。留空时回退到仓库默认列表。
          LLM_MODELS: ${{ inputs.models || secrets.LLM_MODELS || 'kilo/kilo-auto/free,kilo/poolside/laguna-s-2.1:free' }}
          LLM_CONCURRENCY: ${{ secrets.LLM_CONCURRENCY || '10' }}
          LLM_EXTRA_BODY: ${{ secrets.LLM_EXTRA_BODY }}
          # ---------- 免费层（独立于 LLM_MODELS） ----------
          # bilibili Index-Translate 公开 API：无需 key、无 SLA。失败快速降级到上面的回退池
          # （单次尝试、无退避、60 秒超时；连续 2 次失败才熔断）。
          #
          # ⚠️ 2026-10-20 实测：主模型 `Index-Translate-35B-A3B` **持续 504**（服务端推理卡死，
          # /health 仍报 true，属元数据不可信）。同服务上只剩两个 syllable 模型可用：
          #   index-mt-9b-syllable  200 / 约 300ms / § 与占位符零漂移
          #   index-mt-2b-syllable  200 / 约 250ms（会出繁体，优先 9b）
          # syllable 是**逐句模型**：给它 N 行只回 1 行且回哪行不可控，因此流水线按模型名
          # 自动切到「一行一个请求」的逐句路径（scripts/lib/line-translator.mjs）。
          # 本机实测并发 32 是拐点（58 行/秒），CI 出口未验证，故取 16 留余量。
          #
          # 若 35B 恢复，把 FREE_TIER_MODEL 改回 Index-Translate-35B-A3B 即可回到整块模式
          # （逐句标记由模型名判定，无需改代码）。
          # FREE_TIER_ENABLED 优先级最高：设成 0 时无论管理员勾了什么，免费层都整体关闭
          # （pipeline 侧 freeTierEnabled() 直接不构造免费层 provider）。
          FREE_TIER_ENABLED: ${{ secrets.FREE_TIER_ENABLED || '1' }}
          FREE_TIER_BASE_URL: ${{ secrets.FREE_TIER_BASE_URL }}
          # 免费层模型来源优先级：本页勾选（inputs.freeTierModel）> 仓库 secret > 默认值。
          # **没勾选 ≠ 关闭免费层**：inputs 为空时照旧走 secret/默认值，免费层始终优先。
          # 勾选由 Worker 单独走 inputs.freeTierModel 传入，不会混进上面的 LLM_MODELS。
          # FREE_TIER_MODEL **不兜硬编码默认值**：兜底会把默认多模型池收窄成单模型。
          # 两个都不设时由 pipeline.mjs 的 DEFAULT_FREE_TIER_MODELS（5 模型池）生效。
          FREE_TIER_MODEL: ${{ inputs.freeTierModel || secrets.FREE_TIER_MODEL }}
          FREE_TIER_MODELS: ${{ inputs.freeTierModels || secrets.FREE_TIER_MODELS }}
          FREE_TIER_CONCURRENCY: ${{ secrets.FREE_TIER_CONCURRENCY || '16' }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }} # 保留，作为 LLM_API_KEY 的别名
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      - name: Mirror to cloud drives
        id: mirror
        # 两段式设计：镜像失败**不阻断**发布 —— 翻译产物（lang + 页面）是主要价值，先让它入库；
        # 但「零链接却绿灯」不可接受，故本步骤的失败由**下面独立的一步**（Fail if quark mirror
        # totally failed）在 Commit and push / Trigger deploy 之后统一判红。
        # mirror.mjs 在两种「有活要干却零链接」时退出码非 0，都必须变红：
        #   a) 真的尝试过上传/分享但一条都没成功（典型原因就是登录态过期）；
        #   b) QUARK_REQUIRED=1 时 QUARK_CLI 缺失（Install quark CLI 下载/安装失败），根本没尝试上传。
        # 部分成功仍退出 0，已拿到的链接照常写入，不因个别失败丢弃整轮。
        # 注意：env: 里的值不会被 shell 展开，所以 QUARK_CLI 的 $HOME 在 run 里 export。
        #
        # 为什么用全量模式（不带 --ids）：mirror.mjs 全量模式只补「有汉化文件但没有分享链接」
        # 的条目（有链接的会跳过，见 scripts/mirror.mjs 的跳过判据）。因此它同时覆盖两件事：
        #   ① 本轮新翻译的条目；
        #   ② 历史遗留的缺口（镜像失败的条目过去会永久停在「镜像缺失」，无人重试）。
        # 顺带：这些条目的队列状态会被 mirror.mjs 回写成「已完成」。
        # 不要改回 --ids —— 那会丢掉「自动补历史缺口」的能力。
        continue-on-error: true
        run: |
          CLI="$HOME/.pi/agent/skills/quarkclouddrive/scripts/quark-drive.cjs"
          if [ -f "$CLI" ]; then
            export QUARK_CLI="$CLI"
            echo "夸克 CLI：$CLI（$(wc -c < "$CLI" | tr -d ' ') 字节）"
          else
            # 安装步骤是容错的，CLI 缺失时这里明确跳过（不静默），也不置红。
            echo "::warning::夸克 CLI 不存在（Install quark CLI 未成功），本轮跳过夸克镜像；该网盘字段留空，不影响翻译发布。"
          fi
          node scripts/mirror.mjs
        env:
          # CLI 运行时门禁
          QODER_PRODUCT_ID: qoder
          QODER_AGENT: 'true'
          QUARK_DIR_NAME: 光影汉化
          QUARK_PARENT_FID: ${{ secrets.QUARK_PARENT_FID }}
          # 本轮「必须」完成夸克镜像：有目标待镜像而 QUARK_CLI 缺失时 mirror.mjs 置退出码 1。
          # 不设（或非 '1'）时 mirror.mjs 保持原行为：CLI 缺失只跳过、不报错。
          QUARK_REQUIRED: '1'
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      - name: Repack lang sources
        # pipeline 会把本次新翻译的 en_US.lang 写入 sources/；
        # 必须重新打包，否则新光影在下次 CI 校验时找不到英文源而假失败。
        # 打包会与已有包合并，不会抹掉历史条目。
        # 零产出时 sources/ 不存在（gitignored），必须跳过而不是失败，
        # 否则整个 workflow 会被判失败，后面的 Commit and push 不执行。
        run: |
          if [ ! -d sources ]; then
            echo "本次没有新翻译（sources/ 不存在），跳过打包"
            exit 0
          fi
          npm run pack:lang

      # 闸门（写入之后）：上面的 Run tests 跑在 Translate 之前，只能拦历史数据；
      # 本次 Translate / Mirror 新写入的产物不在那次校验范围内，曾出现「本轮 run 绿、
      # 下一个 deploy 红」的静默失败（makeup-ultra-fast-shader 缺 modrinth + 防死链回归）。
      # 与前面「写入之前」的闸门互补：宁可这一轮产物不推、run 变红，
      # 也不要把「下一个 deploy 必红」的数据留在 main 上。
      - name: Validate data contract after translate
        run: npm test

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 显式路径，禁止 git add -A（否则会裹入无关文件）
          for p in site/public/lang site/data/shaders.json site/data/glossary.json site/data/modrinth-catalog.json site/data/curseforge-catalog.json data/lang-sources.json.gz; do
            [ -e "$p" ] && git add -- "$p"
          done
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "翻译: ${{ inputs.ids }}"
          # 并发保护：别的 workflow/提交可能刚推到当前分支，先 rebase 再推，失败重试一次。
          # 只 rebase，绝不 force push；rebase 输出原样打印，失败原因可见。
          #
          # 目标分支必须是 **本 workflow 被派发的那个分支**，不能写死 main：
          # 在特性分支上 dispatch 时，`pull --rebase origin main` 会把 main 的提交
          # 拉进当前分支，而本分支已有的提交在 main 上不存在 → 每个文件 add/add 冲突，
          # 整个 run 在最后一步变红（2026-10-20 实测，翻译本身已全部成功）。
          # 在 main 上运行时 $GITHUB_REF_NAME 就是 main，行为与旧写法逐字一致。
          pushed=false
          for attempt in 1 2; do
            if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
              echo "rebase 失败（第 ${attempt} 次），原因见上方输出"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            if git push; then
              pushed=true
              break
            fi
            echo "push 第 ${attempt} 次失败，重试"
            sleep 5
          done
          # 只有确实推送成功才输出 pushed=true；两次都失败则让 run 变红。
          if [ "$pushed" = "true" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "push 连续 2 次失败，退出非 0"
            exit 1
          fi

      # GITHUB_TOKEN 的 push 不触发下游 workflow，故推送成功后显式 dispatch deploy。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      # 夸克镜像没干成（登录态过期 / CLI 缺失）必须变红，但要在产物入库之后 ——
      # 这样"翻译已发布、只是网盘链接为空"这个事实能被明确看见，而不是静默绿灯。
      - name: Fail if quark mirror totally failed
        if: steps.mirror.outcome == 'failure'
        run: |
          echo "::error::夸克镜像未完成（多为登录态过期，或 CLI 下载/安装失败）。翻译产物已入库；网盘字段为空，需修好后重跑镜像。"
          exit 1
