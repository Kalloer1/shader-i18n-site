name: CF probe (CurseForge reachability from CI)
# 一次性诊断：验证 GitHub runner（不同出口 IP）能否访问 CurseForge API 并下载包，
# 顺便统计热门包是否含 shaders/lang/en_US.lang。
# 背景：本机被 CurseForge 的 CloudFront 边缘 WAF 拦截（403），需在 CI 复测。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe CurseForge
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/cf-probe.mjs